is.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap\">\n<style>\n/* Concept: airy white page, deep navy ink, halftone dot fields in teal and blue, two-tone headlines, hairline dividers with a small square marker, mono labels, one dark teal section with translucent panels. Single committed look. */\n:root {\n  --ink: #0E1330; --ink-2: #5F6573; --blue: #3A66BD; --blue-soft: #7EA7E9; --green: #12795A; --green-soft: #44B48B;\n  --pale: #F4F6FB; --paper: #FFFFFF; --line: #DDE2EC; --navy: #1B2060; --deep: #011821; --on-deep: #9FB3B8; --tintbg: #CFE6EA;\n  --sans: 'Figtree', 'Segoe UI', system-ui, Arial, sans-serif; --mono: 'Figtree', 'Segoe UI', system-ui, sans-serif;\n  --gutter-l: max(20px, env(safe-area-inset-left, 0px)); --gutter-r: max(20px, env(safe-area-inset-right, 0px));\n  color-scheme: light;\n}\n* { box-sizing: border-box; margin: 0; }\nhtml { scroll-behavior: smooth; background: var(--paper); }\nbody { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }\na { color: inherit; text-decoration: none; }\n:focus-visible { outline: 3px solid var(--blue-soft); outline-offset: 3px; }\n.wrap { max-width: 1120px; margin-inline: auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); position: relative; }\nh1, h2, h3 { letter-spacing: -.03em; text-wrap: balance; }\nh2 { font-size: clamp(23px, 2.55vw, 33.5px); line-height: 1.12; font-weight: 600; color: var(--ink); max-width: 20ch; }\nh2 .g { color: #6A7289; }\n.mono { font-family: var(--mono); font-size: 11px; letter-spacing: .02em; }\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 18px; border-radius: 8px; font: 500 12.9px var(--sans); border: 1px solid transparent; cursor: pointer; transition: background .2s ease, border-color .2s ease, transform .2s ease; }\n.btn:hover { transform: translateY(-1px); }\n.btn-navy { background: var(--navy); color: #fff; }\n.btn-navy:hover { background: #121748; }\n.btn-line { background: #fff; border-color: var(--line); color: var(--ink); }\n.btn-line:hover { border-color: var(--ink); }\n.chev { display: inline-block; transition: transform .2s ease; }\na:hover > .chev, .btn:hover .chev { transform: translateX(3px); }\n.halftone { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }\n\n/* section head: hairline with a small square marker */\n.head { position: relative; border-top: 1px solid var(--line); padding-top: 40px; margin-bottom: 40px; }\n.head::before { content: \"\"; position: absolute; left: 0; top: -10px; width: 19px; height: 19px; border: 1px solid var(--line); border-radius: 3px; background: var(--pale); }\n.head.on-deep { border-color: rgba(255, 255, 255, .14); }\n.head.on-deep::before { background: #0A2A35; border-color: rgba(255, 255, 255, .18); }\n.head p { margin-top: 14px; color: var(--ink-2); max-width: 54ch; font-size: 14px; }\n.head-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }\n.more { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; color: var(--blue); }\n.more:hover { text-decoration: underline; text-underline-offset: 4px; }\nsection { padding-block: 72px; }\n\n/* header + hero */\n.bar { position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-block: 22px; }\n.logo { font-size: 18.5px; font-weight: 600; letter-spacing: -.04em; display: inline-flex; align-items: center; gap: 9px; }\n.logo i { width: 22px; height: 22px; border-radius: 6px; background: var(--navy); position: relative; display: block; }\n.logo i::before, .logo i::after { content: \"\"; position: absolute; left: 6px; right: 6px; height: 2px; border-radius: 2px; background: #fff; }\n.logo i::before { top: 7px; } .logo i::after { top: 12px; right: 10px; }\n.bar-end { display: flex; align-items: center; gap: 18px; }\n.bar-end .tel { color: var(--ink-2); font-size: 12.9px; }\n.hero { position: relative; overflow: hidden; padding-bottom: 90px; }\n.hero .halftone { z-index: 0; }\n.hero-grid { position: relative; z-index: 2; display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 48px; align-items: center; padding-top: 56px; min-height: 470px; }\n.hero h1 { font-size: clamp(36px, 4.4vw, 56px); line-height: 1.06; font-weight: 600; letter-spacing: -.045em; max-width: 14ch; animation: rise .8s cubic-bezier(.2, .7, .2, 1) both; }\n.hero h1 .g { color: #6A7289; }\n.hero-sub { margin-top: 20px; max-width: 42ch; color: var(--ink); font-size: 15.5px; animation: rise .8s .1s cubic-bezier(.2, .7, .2, 1) both; }\n.fcard { position: relative; width: min(360px, 100%); justify-self: end; background: rgba(255, 255, 255, .82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(14, 19, 48, .08); border-radius: 14px; padding: 22px 24px 24px; box-shadow: 0 1px 2px rgba(14, 19, 48, .04), 0 28px 60px rgba(14, 19, 48, .14); animation: rise .9s .25s cubic-bezier(.2, .7, .2, 1) both; }\n.fcard .tag { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; color: var(--green); }\n.fcard .tag::before { content: \"\"; width: 7px; height: 7px; border-radius: 50%; background: var(--green-soft); }\n.fcard h3 { margin-top: 12px; font-size: 18.5px; line-height: 1.18; font-weight: 600; letter-spacing: -.03em; }\n.fcard .meta { margin-top: 6px; color: var(--ink-2); }\n.fcard .row { margin-top: 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }\n.fcard .price { font-size: 28px; font-weight: 400; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }\n.trail { position: absolute; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }\n@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }\n\n/* partners */\n.logos-row { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--paper); position: relative; z-index: 2; }\n.logos { list-style: none; padding: 26px 0; display: flex; align-items: center; justify-content: space-between; gap: 18px 36px; flex-wrap: wrap; }\n.logos img { display: block; height: 32px; width: auto; max-width: 100%; filter: grayscale(1); opacity: .72; transition: filter .3s ease, opacity .3s ease; }\n.logos li:hover img { filter: none; opacity: 1; }\n\n/* topics */\n.tgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }\n.tcard { display: flex; flex-direction: column; justify-content: space-between; gap: 30px; min-height: 142px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 16px 20px; transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease; }\n.tcard:hover { border-color: var(--ink); box-shadow: 0 14px 30px rgba(14, 19, 48, .08); transform: translateY(-3px); }\n.tcard h3 { font-size: 15.5px; font-weight: 500; line-height: 1.22; letter-spacing: -.02em; max-width: 14ch; }\n.tcard .tf { display: flex; justify-content: space-between; align-items: center; }\n.tcard .n { font-family: var(--mono); font-size: 11.5px; color: var(--green); background: #ECF7F2; padding: 3px 9px; border-radius: 6px; }\n.tcard .go { color: var(--blue); font-size: 16.5px; transition: transform .2s ease; }\n.tcard:hover .go { transform: translateX(4px); }\n.tmore { display: flex; flex-direction: column; justify-content: space-between; min-height: 142px; border: 1px dashed #B9C2D3; border-radius: 12px; padding: 18px 20px; background: var(--pale); color: var(--ink); transition: border-color .25s ease, background .25s ease; }\n.tmore:hover { border-color: var(--ink); background: #fff; }\n.tmore span { font-size: 15.5px; font-weight: 500; letter-spacing: -.02em; }\n.tmore .go { color: var(--blue); font-size: 16.5px; }\n\n/* photos: cool duotone, full color on hover */\n.pic { position: relative; background: var(--tintbg); overflow: hidden; }\n.pic img { display: block; width: 100%; height: 100%; object-fit: cover; mix-blend-mode: multiply; filter: grayscale(1) contrast(1.05); transition: filter .5s ease, transform .7s ease; }\n.pic.top img { object-position: center 18%; }\n.hot:hover .pic img { filter: grayscale(0); mix-blend-mode: normal; }\n\n/* courses */\n.courses { background: var(--pale); }\n.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }\n.card { position: relative; display: block; aspect-ratio: 4 / 4.6; border-radius: 14px; overflow: hidden; background: var(--tintbg); border: 1px solid var(--line); transition: transform .3s cubic-bezier(.2, .7, .2, 1), box-shadow .3s ease; }\n.card:hover { transform: translateY(-5px); box-shadow: 0 22px 44px rgba(14, 19, 48, .16); }\n.card .pic { position: absolute; inset: 0; }\n.card:hover .pic img { transform: scale(1.04); }\n.card .code { position: absolute; left: 12px; top: 12px; z-index: 2; font-family: var(--mono); font-size: 11px; padding: 3px 8px; border-radius: 6px; background: rgba(255, 255, 255, .94); color: var(--ink); }\n.card .pp { position: absolute; right: 12px; top: 12px; z-index: 2; background: var(--blue); color: #fff; font-size: 12.9px; font-weight: 600; padding: 4px 11px; border-radius: 6px; font-variant-numeric: tabular-nums; }\n.card .info { position: absolute; left: 8px; right: 8px; bottom: 8px; background: #fff; border-radius: 10px; padding: 14px 16px 16px; }\n.card .tp { font-family: var(--mono); font-size: 11px; color: var(--green); }\n.card h3 { margin-top: 4px; font-size: 15.5px; font-weight: 600; line-height: 1.2; letter-spacing: -.025em; }\n\n/* stats + quote */\n.stats-wrap { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, ><span class=\"sw-n\" id=\"swName\">Column<\u002Fspan><\u002Fnav>\n<\u002Fbody>\n<\u002Fhtml>\n", "maze": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Training Solutions Maze Style<\u002Ftitle>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600&display=swap\">\n<style>\n/* Concept: warm off-white page, near-black ink, huge light tightly tracked headlines, a lime gradient band for topics, a pixelated lime circle behind the services heading, white rounded cards with tiny outlined chips, pill buttons, a mint stats panel. Single committed look. */\n:root {\n  --tint: #CFE5F9; --bg: #FFFFFF; --ink: #1E1E1E; --mute: #66655E; --lime: #CFE5F9; --lime-2: #E6F1FC; --mint: #D4E8FB; --card: #FFFFFF; --line: rgba(30, 30, 30, .13);\n  --sans: 'Figtree', 'Segoe UI', system-ui, Arial, sans-serif;\n  --gutter-l: max(20px, env(safe-area-inset-left, 0px)); --gutter-r: max(20px, env(safe-area-inset-right, 0px));\n  color-scheme: light;\n}\n* { box-sizing: border-box; margin: 0; }\nhtml { scroll-behavior: smooth; background: var(--bg); }\nbody { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }\na { color: inherit; text-decoration: none; }\n:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }\n.wrap { max-width: 1160px; margin-inline: auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); position: relative; }\nh1, h2, h3 { font-weight: 300; text-wrap: balance; }\nh2 { font-size: clamp(30px, 3.96vw, 55px); line-height: 1; letter-spacing: -.05em; }\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; fff; }\n.tmore span { font-size: 17.5px; font-weight: 400; letter-spacing: -.045em; line-height: 1.08; }\n.tmore .arr { width: 30px; height: 30px; border-radius: 50%; border: 1px solid currentColor; display: inline-flex; align-items: center; justify-content: center; }\n\n/* courses */\n.courses { padding-top: 40px; }\n.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 44px; }\n.head p { margin-top: 18px; color: var(--mute); font-size: 15.5px; max-width: 40ch; }\n.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }\n.card { position: relative; display: block; aspect-ratio: 4 / 4.7; border-radius: 16px; overflow: hidden; background: var(--tint); transition: transform .3s cubic-bezier(.2, .7, .2, 1), box-shadow .3s ease; }\n.card:hover { transform: translateY(-6px); box-shadow: 0 26px 50px rgba(30, 30, 30, .16); }\n.card .pic { position: absolute; inset: 0; }\n.card:hover .pic img { transform: scale(1.05); }\n.card .code { position: absolute; left: 12px; top: 12px; z-index: 2; }\n.card .pp { position: absolute; right: 12px; top: 12px; z-index: 2; background: var(--ink); color: #fff; font-size: 12.9px; font-weight: 500; padding: 4px 12px; border-radius: 999px; font-variant-numeric: tabular-nums; }\n.card .info { position: absolute; left: 8px; right: 8px; bottom: 8px; background: var(--card); border-radius: 12px; padding: 14px 16px 16px; }\n.card .info .chip { margin-bottom: 8px; }\n.card h3 { font-size: 17.5px; font-weight: 400; line-height: 1.1; letter-spacing: -.04em; }\n\n/* services */\n.svc-intro { position: relative; text-align: center; padding-block: 120px 100px; }\n.svc-intro canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; }\n.svc-intro h2 { position: relative; max-width: 16ch; margin-inline: auto; font-size: clamp(31.5px, 4.47vw, 62px); }\n.svc-intro p { position: relative; max-width: 40ch; margin: 24px
