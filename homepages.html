: 0; top: -10px; width: 19px; height: 19px; border: 1px solid var(--line); border-radius: 3px; background: var(--pale); }\n.head.on-deep { border-color: rgba(255, 255, 255, .14); }\n.head.on-deep::before { background: #0A2A35; border-color: rgba(255, 255, 255, .18); }\n.head p { margin-top: 14px; color: var(--ink-2); max-width: 54ch; font-size: 15px; }\n.head-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }\n.more { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; color: var(--blue); }\n.more:hover { text-decoration: underline; text-underline-offset: 4px; }\nsection { padding-block: 72px; }\n\n/* header + hero */\n.bar { position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-block: 22px; }\n.logo { font-size: 21px; font-weight: 600; letter-spacing: -.04em; display: inline-flex; align-items: center; gap: 9px; }\n.logo i { width: 22px; height: 22px; border-radius: 6px; background: var(--navy); position: relative; display: block; }\n.logo i::before, .logo i::after { content: \"\"; position: absolute; left: 6px; right: 6px; height: 2px; border-radius: 2px; background: #fff; }\n.logo i::before { top: 7px; } .logo i::after { top: 12px; right: 10px; }\n.bar-end { display: flex; align-items: center; gap: 18px; }\n.bar-end .tel { color: var(--ink-2); font-size: 14px; }\n.hero { position: relative; overflow: hidden; padding-bottom: 90px; }\n.hero .halftone { z-index: 0; }\n.hero-grid { position: relative; z-index: 2; display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 48px; align-items: center; padding-top: 56px; min-height: 470px; }\n.hero h1 { font-size: clamp(36px, 4.4vw, 56px); line-height: 1.06; font-weight: 600; letter-spacing: -.045em; max-width: 14ch; animation: rise .8s cubic-bezier(.2, .7, .2, 1) both; }\n.hero h1 .g { color: #6A7289; }\n.hero-sub { margin-top: 20px; max-width: 42ch; color: var(--ink); f
