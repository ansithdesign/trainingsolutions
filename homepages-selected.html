m .7s ease; }\n.pic.top img { object-position: center 18%; }\n.hot:hover .pic img, .pic.live img { filter: grayscale(0); mix-blend-mode: normal; }\n\n/* header + hero */\n.bar { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-block: 18px; }\n.logo { font-size: 19.5px; font-weight: 500; letter-spacing: -.05em; display: inline-flex; align-items: center; gap: 8px; }\n.logo i { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; }\n.logo i::before, .logo i::after { content: \"\"; width: 4px; border-radius: 1px; background: var(--ink); }\n.logo i::before { height: 16px; } .logo i::after { height: 10px; }\n.logo i b { width: 4px; height: 13px; border-radius: 1px; background: var(--ink); display: block; }\n.bar-end { display: flex; align-items: center; gap: 14px; }\n.bar-end .tel { color: var(--mute); font-size: 12.9px; margin-right: 6px; }\n.hero { padding-block: 40px 90px; }\n.hero-grid { display: grid; grid-template-columns: minmax(0, 6.4fr) minmax(0, 5.6fr); gap: 40px; align-items: center; }\n.hero h1 { font-size: clamp(42px, 6vw, 88px); line-height: .96; letter-spacing: -.05em; animation: rise .9s cubic-bezier(.2, .7, .2, 1) both; }\n.hero-sub { margin-top: 28px; max-width: 34ch; color: var(--mute); font-size: 15.5px; line-height: 1.5; animation: rise .9s .1s cubic-bezier(.2, .7, .2, 1) both; }\n.frames { position: relative; height: 540px; }\n.fr { position: absolute; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--tint); }\n.fr .pic { width: 100%; height: 100%; }\n.fA { right: 0; top: 0; width: 62%; height: 330px; }\n.fB { left: 0; top: 70px; width: 34%; height: 170px; }\n.fC { left: 14%; top: 262px; width: 36%; height: 190px; }\n@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }\n\n/* partners: ruled cells */\n.logos { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); }\n.logos li { d
