<!doctype html>
<html lang="en" data-doc="more">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Solutions Homepages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..800;1,300..800&family=Inter:wght@300;400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Mona+Sans:wght@500;600;700&display=swap">
<style>
/* One content model, ten designs. Each design sets color tokens per section, a type pairing, a radius scale and a layout for every section. Photos are always shown in natural color. */
* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; background: #fff; }
body { font-family: var(--fb, 'Figtree', system-ui, sans-serif); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; background: var(--bg, #fff); color: #111; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 3px solid var(--ac); outline-offset: 3px; }
#app { --gl: max(20px, env(safe-area-inset-left, 0px)); --gr: max(20px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1200px; margin-inline: auto; padding-left: var(--gl); padding-right: var(--gr); position: relative; }
.sec { background: var(--bg-s); color: var(--fg-s); padding-block: var(--sp, 96px); position: relative; }
h1, h2, h3 { font-family: var(--fd); font-weight: var(--wd); letter-spacing: var(--ls); text-wrap: balance; }
h2 { font-size: var(--h2, clamp(26.5px, 3.1vw, 43px)); line-height: 1.04; }
.mu { color: var(--mu); }
em { font-style: normal; }

/* section tokens */
.s-hero { --bg-s: var(--hero-bg); --fg-s: var(--hero-fg); --mu: var(--hero-mu); --ln: var(--hero-ln); --cd: var(--hero-cd); --cf: var(--hero-cf); }
.s-trust { --bg-s: var(--trust-bg); --fg-s: var(--trust-fg); --mu: var(--trust-mu); --ln: var(--trust-ln); }
.s-topics { --bg-s: var(--topics-bg); --fg-s: var(--topics-fg); --mu: var(--topics-mu); --ln: var(--topics-ln); --cd: var(--topics-cd); --cf: var(--topics-cf); }
.s-courses { --bg-s: var(--courses-bg); --fg-s: var(--courses-fg); --mu: var(--courses-mu); --ln: var(--courses-ln); --cd: var(--courses-cd); --cf: var(--courses-cf); }
.s-svc { --bg-s: var(--svc-bg); --fg-s: var(--svc-fg); --mu: var(--svc-mu); --ln: var(--svc-ln); --cd: var(--svc-cd); --cf: var(--svc-cf); }
.s-proof { --bg-s: var(--proof-bg); --fg-s: var(--proof-fg); --mu: var(--proof-mu); --ln: var(--proof-ln); --cd: var(--proof-cd); --cf: var(--proof-cf); }
.s-cta { --bg-s: var(--cta-bg); --fg-s: var(--cta-fg); --mu: var(--cta-mu); --ln: var(--cta-ln); }
.s-foot { --bg-s: var(--foot-bg); --fg-s: var(--foot-fg); --mu: var(--foot-mu); --ln: var(--foot-ln); }

/* buttons + chips */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 46px; padding: 0 22px; border-radius: var(--rb); background: var(--ac); color: var(--af); font-weight: 600; font-size: 12.9px; border: 1px solid transparent; cursor: pointer; transition: transform .25s cubic-bezier(.2, .7, .2, 1), box-shadow .25s ease, background .2s ease; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0, 0, 0, .18); }
.btn .arr, .more .arr { display: inline-block; transition: transform .25s cubic-bezier(.2, .7, .2, 1); }
.btn:hover .arr, .more:hover .arr { transform: translateX(4px); }
.more { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; border-bottom: 1.5px solid currentColor; padding-bottom: 3px; }
.ic svg, .ti svg { width: 20px; height: 20px; display: block; }

/* header */
.bar { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding-block: 22px; position: relative; z-index: 3; }
.logo { display: inline-flex; align-items: center; gap: 10px; font-family: var(--fd); font-size: 17.5px; font-weight: 600; letter-spacing: -.03em; }
.logo i { width: 24px; height: 24px; border-radius: calc(var(--rs) * .55); background: var(--ac); position: relative; flex: none; }
.logo i::before, .logo i::after { content: ""; position: absolute; left: 6px; height: 2.5px; border-radius: 2px; background: var(--af); }
.logo i::before { right: 6px; top: 8px; } .logo i::after { right: 10px; top: 13.5px; }
.bar-end { display: flex; align-items: center; gap: 18px; }
.bar-end .tel { color: var(--mu); font-size: 12.9px; }
.cart { display: inline-flex; align-items: center; min-height: 38px; padding: 0 16px; border-radius: var(--rb); border: 1px solid var(--ln); font-weight: 500; font-size: 12.9px; transition: background .2s ease, color .2s ease; }
.cart:hover { background: var(--fg-s); color: var(--bg-s); }
.mini { position: fixed; z-index: 80; left: 0; right: 0; top: 0; transform: translateY(-110%); transition: transform .35s cubic-bezier(.2, .7, .2, 1); background: var(--mini-bg); color: var(--mini-fg); border-bottom: 1px solid var(--mini-ln); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.mini.on { transform: none; }
.mini .wrap { display: flex; justify-content: space-between; align-items: center; padding-block: 10px; }
.mini .tel { font-weight: 600; }

/* hero */
.hero { overflow: hidden; }
.hero-grid { position: relative; z-index: 2; }
.hero h1 { font-size: var(--h1); line-height: 1.02; }
.hero .sub { margin-top: 22px; max-width: 44ch; font-size: 15.5px; color: var(--mu); }
.ph { margin: 0; overflow: hidden; background: var(--ph-bg, #ddd); }
.ph img { width: 100%; height: 100%; object-fit: cover; transition: transform .9s cubic-bezier(.2, .7, .2, 1); }
.hero-art:hover .ph img { transform: scale(1.03); }
.fcard { background: var(--cd, #fff); color: var(--cf, #111); border-radius: var(--rd); padding: 16px 18px 18px; box-shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 26px 60px rgba(0, 0, 0, .22); display: grid; grid-template-columns: 84px 1fr; gap: 6px 16px; align-items: start; width: min(380px, 100%); }
.fcard .fc { grid-row: 1 / span 3; border-radius: calc(var(--rs) * .6); overflow: hidden; box-shadow: 0 10px 22px rgba(0, 0, 0, .2); }
.fcard .fc img { width: 100%; height: auto; }
.fcard .ft { font-size: 11px; font-weight: 600; color: var(--ai); }
.fcard h3 { font-size: 16.5px; line-height: 1.15; font-weight: 600; letter-spacing: -.02em; font-family: var(--fd); }
.fcard .fm { font-size: 11px; opacity: .65; }
.fcard .fr { grid-column: 2; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; margin-top: 8px; }
.fcard .btn { white-space: nowrap; }
.fcard .price { font-family: var(--fd); font-size: 24.5px; letter-spacing: -.04em; }
.fcard .btn { min-height: 38px; padding: 0 16px; }

.hv-collage .hero-grid { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 6fr); gap: 48px; align-items: center; padding-block: 36px 130px; }
.hv-collage .hero-art { position: relative; height: 540px; }
.hv-collage .p1 { position: absolute; right: 0; top: 0; width: 62%; height: 400px; }
.hv-collage .p2 { position: absolute; left: 0; top: 70px; width: 34%; height: 170px; }
.hv-collage .p3 { position: absolute; left: 14%; top: 262px; width: 36%; height: 190px; }
.hv-collage .fcard { position: absolute; right: 0; bottom: 0; }
.hv-center .hero-grid { padding-block: 24px 120px; }
.hv-center .hero-copy { max-width: 860px; margin-inline: auto; text-align: center; }
.hv-center .hero .sub, .hv-center .sub { margin-inline: auto; }
.hv-center .hero-art { display: grid; grid-template-columns: 1fr 1.7fr 1fr; gap: 16px; align-items: end; margin-top: 56px; position: relative; }
.hv-center .p1 { order: 2; height: 380px; } .hv-center .p2 { order: 1; height: 250px; } .hv-center .p3 { order: 3; height: 290px; }
.hv-center .fcard { position: absolute; left: 50%; bottom: -54px; transform: translateX(-50%); z-index: 3; width: min(420px, 90%); }
.hv-type .hero-grid { padding-block: 24px 110px; }
.hv-type h1 { max-width: 15ch; }
.hv-type .hero-art { display: grid; grid-template-columns: 1.25fr 1fr 1fr 1.15fr; gap: 14px; margin-top: 52px; align-items: stretch; }
.hv-type .ph { min-height: 280px; }
.hv-type .p2 { transform: translateY(36px); } .hv-type .p3 { transform: translateY(-18px); }
.hv-type .fcard { align-self: end; width: 100%; grid-template-columns: 1fr; } .hv-type .fcard .fc { display: none; } .hv-type .fcard .fr { grid-column: 1; }
.hv-bleed { min-height: 780px; display: flex; flex-direction: column; }
.hv-bleed .bgph { position: absolute; inset: 0; z-index: 0; }
.hv-bleed .bgph img { width: 100%; height: 100%; object-fit: cover; }
.hv-bleed .bgph::after { content: ""; position: absolute; inset: 0; background: var(--bleed); }
.hv-bleed .hero-grid { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 40px; padding-block: 90px 56px; }
.hv-bleed .hero-copy { max-width: 760px; }
.hv-bleed .ph { display: none; }
.hv-bleed .hero-art { display: flex; justify-content: flex-end; margin-top: 0; }
.hv-phone .hero-grid { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 40px; align-items: center; padding-block: 36px 120px; }
.hv-phone .hero-art { position: relative; height: 560px; }
.hv-phone .p1 { position: absolute; right: 110px; top: 0; width: 260px; height: 520px; border-radius: 46px; border: 10px solid var(--fg-s); }
.hv-phone .p2, .hv-phone .p3 { display: none; }
.hv-phone .fcard { position: absolute; right: 0; bottom: 20px; }

/* partners strip */
.s-trust { padding-block: 28px; border-bottom: 1px solid var(--ln); }
.trust-in { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 9fr); gap: 32px; align-items: center; }
.since { font-size: 14px; font-weight: 500; max-width: 24ch; line-height: 1.35; color: var(--mu); }
.logos { list-style: none; padding: 0; display: flex; align-items: center; justify-content: space-between; gap: 18px 40px; flex-wrap: wrap; }
.logos img { height: 34px; width: auto; transition: transform .3s ease; }
.logos li:hover img { transform: translateY(-2px); }

/* section heads */
.sec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 28px; flex-wrap: wrap; margin-bottom: 44px; }
.sec-head p { margin-top: 14px; color: var(--mu); font-size: 14.5px; max-width: 46ch; }
.head-r { display: flex; align-items: center; gap: 12px; }
.rail-nav { display: none; gap: 8px; }
.rail-nav button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--ln); background: transparent; cursor: pointer; font-size: 16.5px; transition: background .2s ease, color .2s ease, transform .2s ease; }
.rail-nav button:hover { background: var(--fg-s); color: var(--bg-s); transform: translateY(-2px); }
.cv-rail ~ * .rail-nav { display: flex; }

/* topics */
.tl { display: grid; }
.t { color: var(--cf, inherit); }
.tv-index { grid-template-columns: 1fr 1fr; column-gap: 64px; border-top: 1.5px solid var(--fg-s); }
.tv-index .t { display: grid; grid-template-columns: 44px 1fr auto 26px; align-items: center; gap: 16px; padding: 18px 6px; border-bottom: 1px solid var(--ln); color: inherit; transition: background .25s ease, padding .25s cubic-bezier(.2, .7, .2, 1), color .2s ease; }
.tv-index .ti { width: 40px; height: 40px; border-radius: calc(var(--rs) * .7); background: var(--at); color: var(--ai); display: grid; place-items: center; transition: background .25s ease, color .25s ease, transform .25s ease; }
.tv-index .tt { font-family: var(--fd); font-size: clamp(16.5px, 1.41vw, 21px); font-weight: var(--wd); letter-spacing: var(--ls); line-height: 1.1; }
.tv-index .tc { font-size: 12px; color: var(--mu); font-variant-numeric: tabular-nums; }
.tv-index .ta { opacity: .35; transform: translateX(-6px); transition: transform .25s ease, opacity .25s ease; }
.tv-index .t:hover { padding-left: 16px; background: var(--at); color: var(--ai); }
.tv-index .t:hover .ti { background: var(--ac); color: var(--af); transform: rotate(-6deg); }
.tv-index .t:hover .ta { opacity: 1; transform: none; }
.tv-index .t.more { border-bottom: 1px solid var(--ln); font-weight: 600; grid-template-columns: 1fr 26px; }
.tv-cards { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.tv-cards .t { display: flex; flex-direction: column; justify-content: space-between; gap: 34px; min-height: 176px; background: var(--cd); border: 1px solid var(--ln); border-radius: var(--rd); padding: 18px 18px 16px 20px; transition: transform .3s cubic-bezier(.2, .7, .2, 1), box-shadow .3s ease, background .25s ease, color .25s ease; }
.tv-cards .ti { width: 40px; height: 40px; border-radius: calc(var(--rs) * .75); background: var(--at); color: var(--ai); display: grid; place-items: center; transition: background .25s ease, color .25s ease; }
.tv-cards .tt { display: block; margin-top: 16px; font-family: var(--fd); font-size: 16.5px; font-weight: var(--wd); letter-spacing: var(--ls); line-height: 1.12; }
.tv-cards .tf { display: flex; justify-content: space-between; align-items: center; }
.tv-cards .tc { font-size: 11.5px; color: var(--mu); }
.tv-cards .ta { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--ln); display: grid; place-items: center; transition: transform .3s ease, background .25s ease, color .25s ease; }
.tv-cards .t:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0, 0, 0, .14); background: var(--ac); color: var(--af); border-color: transparent; }
.tv-cards .t:hover .ti { background: rgba(255, 255, 255, .22); color: inherit; }
.tv-cards .t:hover .tc { color: inherit; opacity: .85; }
.tv-cards .t:hover .ta { transform: rotate(-45deg); background: rgba(255, 255, 255, .22); border-color: transparent; }
.tv-cards .t.more { align-items: flex-start; background: transparent; border-style: dashed; justify-content: space-between; }
.tv-pills { display: flex; flex-wrap: wrap; gap: 12px; }
.tv-pills .t { display: inline-flex; align-items: center; gap: 12px; padding: 8px 10px 8px 12px; min-height: 58px; border-radius: 999px; background: var(--cd); border: 1.5px solid var(--ln); font-family: var(--fd); font-size: 16.5px; font-weight: var(--wd); letter-spacing: var(--ls); transition: transform .25s cubic-bezier(.2, .7, .2, 1), background .2s ease, color .2s ease; }
.tv-pills .ti { width: 38px; height: 38px; border-radius: 50%; background: var(--at); color: var(--ai); display: grid; place-items: center; }
.tv-pills .tc { font-family: var(--fb); font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--fg-s); color: var(--bg-s); }
.tv-pills .ta { display: none; }
.tv-pills .t:hover { transform: translateY(-4px) rotate(-1deg); background: var(--ac); color: var(--af); }
.tv-pills .t.more { background: transparent; }

/* courses */
.c { display: flex; flex-direction: column; background: var(--cd); color: var(--cf); border: 1px solid var(--ln); border-radius: var(--rd); overflow: hidden; transition: transform .35s cubic-bezier(.2, .7, .2, 1), box-shadow .35s ease; }
.cover { position: relative; display: grid; place-items: center; padding: 38px 40px 26px; background: var(--cover-bg, var(--at)); aspect-ratio: 5 / 4.4; }
.cover img { height: 100%; width: auto; max-width: 100%; object-fit: contain; border-radius: 3px; box-shadow: 0 2px 4px rgba(0, 0, 0, .12), 0 18px 30px rgba(0, 0, 0, .2); transition: transform .5s cubic-bezier(.2, .7, .2, 1), box-shadow .5s ease; transform-origin: 50% 85%; }
.c:hover .cover img { transform: translateY(-6px) rotate(-2.2deg) scale(1.04); box-shadow: 0 4px 8px rgba(0, 0, 0, .12), 0 30px 44px rgba(0, 0, 0, .26); }
.cc { position: absolute; left: 14px; top: 14px; font-size: 11px; font-weight: 600; letter-spacing: .05em; padding: 4px 9px; border-radius: calc(var(--rs) * .5); background: var(--cd); color: var(--cf); border: 1px solid var(--ln); }
.cb { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.cb .ct { font-size: 11px; font-weight: 600; color: var(--ai); }
.cb h3 { font-size: 16.5px; line-height: 1.18; font-weight: 600; letter-spacing: -.02em; }
.cf { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 8px; }
.price { font-family: var(--fd); font-size: 26.5px; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.go { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; }
.go .ga { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--ln); display: grid; place-items: center; transition: transform .3s ease, background .25s ease, color .25s ease; }
.c:hover .ga { background: var(--ac); color: var(--af); transform: rotate(-45deg); border-color: transparent; }
.cv-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.cv-grid .c:hover { transform: translateY(-6px); box-shadow: 0 26px 46px rgba(0, 0, 0, .15); }
.cv-rail { display: flex; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 6px var(--gr) 30px var(--gl); margin-inline: calc(var(--gl) * -1) calc(var(--gr) * -1); scroll-padding-left: var(--gl); }
.cv-rail::-webkit-scrollbar { display: none; }
.cv-rail .c { flex: 0 0 min(340px, 80vw); scroll-snap-align: start; }
.cv-rail .c:hover { transform: translateY(-6px); box-shadow: 0 26px 46px rgba(0, 0, 0, .15); }
.cv-list { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: 56px; align-items: start; }
.cv-list .lst { border-top: 1.5px solid var(--fg-s); }
.cv-list .r { display: grid; grid-template-columns: 58px 74px minmax(0, 1fr) auto; align-items: center; gap: 18px; padding: 14px 8px 14px 0; border-bottom: 1px solid var(--ln); transition: background .2s ease, padding .25s cubic-bezier(.2, .7, .2, 1); cursor: pointer; }
.cv-list .r .th { width: 58px; height: 74px; display: grid; place-items: center; background: var(--at); border-radius: 4px; overflow: hidden; }
.cv-list .r .th img { height: 100%; width: auto; }
.cv-list .r .rc { font-size: 11px; letter-spacing: .05em; color: var(--mu); font-family: var(--fm, inherit); }
.cv-list .r .rt { font-family: var(--fd); font-size: clamp(15.5px, 1.32vw, 18.5px); font-weight: var(--wd); letter-spacing: var(--ls); line-height: 1.15; }
.cv-list .r .rk { display: block; font-size: 11px; color: var(--ai); font-weight: 600; margin-top: 4px; font-family: var(--fb); letter-spacing: 0; }
.cv-list .r .price { font-size: 19.5px; }
.cv-list .r:hover, .cv-list .r.on { background: var(--at); padding-left: 14px; }
.cv-list .pv { position: sticky; top: 90px; }
.cv-list .pvc { background: var(--at); border-radius: var(--rd); padding: 40px 54px 30px; display: grid; place-items: center; aspect-ratio: 4 / 4.6; border: 1px solid var(--ln); }
.cv-list .pvc img { max-height: 100%; width: auto; border-radius: 4px; box-shadow: 0 3px 6px rgba(0, 0, 0, .14), 0 24px 40px rgba(0, 0, 0, .22); animation: pop .45s cubic-bezier(.2, .7, .2, 1); }
.cv-list .pvb { padding: 20px 4px 0; }
.cv-list .pvb h3 { font-size: 21px; line-height: 1.1; }
.cv-list .pvb .pr { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }

/* services */
.sv-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.sv-cards .s { display: flex; flex-direction: column; background: var(--cd); color: var(--cf); border: 1px solid var(--ln); border-radius: var(--rd); overflow: hidden; transition: transform .35s cubic-bezier(.2, .7, .2, 1), box-shadow .35s ease; }
.sv-cards .s:hover { transform: translateY(-6px); box-shadow: 0 26px 46px rgba(0, 0, 0, .18); }
.sv-cards .si { aspect-ratio: 16 / 10; overflow: hidden; }
.sv-cards .si img { width: 100%; height: 100%; object-fit: cover; transition: transform .9s cubic-bezier(.2, .7, .2, 1); }
.sv-cards .s:hover .si img { transform: scale(1.05); }
.sv-cards .sb { padding: 22px 24px 26px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.sv-cards h3, .sv-stack h3 { font-size: 21px; line-height: 1.1; }
.sv-cards p, .sv-stack p { color: var(--mu); }
.sp { align-self: flex-start; font-size: 12.9px; font-weight: 600; padding: 6px 14px; border-radius: 999px; background: var(--ac); color: var(--af); font-variant-numeric: tabular-nums; margin-top: auto; }
.sv-rows { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: 64px; align-items: start; }
.sv-rows .lst { border-top: 1.5px solid var(--fg-s); }
.sv-rows .s { border-bottom: 1px solid var(--ln); padding: 22px 4px; cursor: pointer; outline-offset: -2px; }
.sv-rows .s h3 { font-size: clamp(19.5px, 1.94vw, 28px); line-height: 1.05; display: flex; justify-content: space-between; align-items: center; gap: 16px; transition: color .2s ease, transform .3s cubic-bezier(.2, .7, .2, 1); }
.sv-rows .s h3::after { content: "+"; font-family: var(--fb); font-weight: 400; font-size: 23px; color: var(--mu); transition: transform .3s ease; }
