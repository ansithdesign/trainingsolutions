<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Training Solutions Shortlist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* Twelve homepage directions for Training Solutions. Content is identical in each; palette, type, layout, components and motion change per direction. Hash picks the design: #c #e #g #h #j #p #q #r #s #t #v #w. */
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { background: var(--page, #fff); transition: background .4s; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; color: inherit; }
ul { list-style: none; padding: 0; }
figure { margin: 0; }

:where(#app) {
  --page: #fff; --bg: #fff; --ink: #111; --mu: #555; --ln: rgba(0,0,0,.12); --ac: #1D68D8; --af: #fff; --ai: #1D68D8; --at: #E6EEFA; --pa: #F3F5F8; --cd: #fff;
  --fd: system-ui, sans-serif; --fb: system-ui, sans-serif; --fm: ui-monospace, Menlo, monospace;
  --wd: 500; --ls: -.035em; --h1: clamp(42px, 6vw, 88px); --h2: clamp(30px, 3.7vw, 54px);
  --r: 22px; --rs: 12px; --rb: 999px; --icw: 1.6; --cap: round; --join: round;
  --gl: max(20px, env(safe-area-inset-left, 0px)); --gr: max(20px, env(safe-area-inset-right, 0px));
  min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--fb); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: clip; position: relative;
}
.wrap { max-width: 1280px; margin-inline: auto; padding-left: var(--gl); padding-right: var(--gr); position: relative; }
h1, h2, h3, h4 { font-family: var(--fd); font-weight: var(--wd); letter-spacing: var(--ls); text-wrap: balance; line-height: 1.04; }
h1 { font-size: var(--h1); }
h2 { font-size: var(--h2); }
h3 { letter-spacing: -.02em; line-height: 1.2; }
em { font-style: normal; }
p { text-wrap: pretty; }
:focus-visible { outline: 2px solid var(--focus, var(--ac)); outline-offset: 3px; border-radius: 4px; }
::selection { background: var(--at); color: var(--ink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* icons: one stroke set; weight, caps and joins change per design */
svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: var(--icw); stroke-linecap: var(--cap); stroke-linejoin: var(--join); flex: none; display: block; }
svg.lm { fill: currentColor; stroke: none; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 46px; padding: 0 22px; border-radius: var(--rb); font: 600 14px/1 var(--fb); border: 1px solid transparent; background: var(--ac); color: var(--af); cursor: pointer; white-space: nowrap; transition: transform .3s cubic-bezier(.2,.8,.2,1), background .25s, color .25s, border-color .25s, box-shadow .3s; }
.btn:hover { transform: translateY(-2px); }
.btn .i { font-size: 15px; transition: transform .3s; }
.btn:hover .i { transform: translateX(3px); }
.btn.ghost { background: transparent; color: inherit; border-color: currentColor; }

/* ===== header bar ===== */
.hd { position: relative; }
.barh { position: relative; z-index: 40; height: var(--barh, 88px); }
.bar { position: absolute; left: 0; right: 0; top: 0; color: var(--bar-fg, var(--ink)); transition: transform .45s cubic-bezier(.2,.8,.2,1), background .3s, color .3s; }
.bar-in { position: relative; height: var(--barh, 88px); display: flex; align-items: center; gap: 22px; }
.bar.stuck { position: fixed; padding-top: env(safe-area-inset-top, 0px); background: var(--bar-sbg, var(--bg)); color: var(--bar-sfg, var(--ink)); box-shadow: 0 1px 0 var(--ln), 0 18px 40px -30px rgba(0,0,0,.35); animation: barIn .45s cubic-bezier(.2,.8,.2,1); }
.bar.stuck .bar-in { height: 70px; }
.bar.away { transform: translateY(-115%); }
@keyframes barIn { from { transform: translateY(-100%); } }
.logo { display: inline-flex; align-items: center; gap: 11px; font-family: var(--fd); font-weight: var(--logo-w, 600); font-size: 18px; letter-spacing: -.025em; white-space: nowrap; flex: none; }
.logo .lm { width: 27px; height: 26px; color: var(--logo-c, currentColor); transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.logo:hover .lm { transform: rotate(-90deg); }
.nv { display: flex; align-items: center; gap: 2px; margin-inline: auto; }
.nv-i { position: relative; }
.nv-i.mega { position: static; }
.nv-b { font: 500 14px var(--fb); color: inherit; background: none; border: 0; padding: 10px 14px; border-radius: var(--rb); display: inline-flex; align-items: center; gap: 7px; cursor: pointer; position: relative; transition: background .25s, color .25s; }
.nv-b .i { font-size: 12px; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.nv-i.open > .nv-b .i { transform: rotate(180deg); }
.nav-soft .nv-b:hover, .nav-soft .nv-i.open > .nv-b { background: var(--nv-hv, rgba(127,127,127,.16)); }
.nav-line .nv-b::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 5px; height: 1.5px; background: currentColor; transform: scaleX(0); transform-origin: right; transition: transform .4s cubic-bezier(.2,.8,.2,1); }
.nav-line .nv-b:hover::after, .nav-line .nv-i.open > .nv-b::after { transform: scaleX(1); transform-origin: left; }
.bar-end { display: flex; align-items: center; gap: 8px; flex: none; }
.b-login { font-weight: 500; font-size: 14px; padding: 10px 14px; border-radius: var(--rb); transition: background .25s; }
.b-login:hover { background: var(--nv-hv, rgba(127,127,127,.16)); }
.b-cart { display: inline-flex; align-items: center; gap: 9px; min-height: 44px; padding: 0 8px 0 18px; border-radius: var(--rb); background: var(--cart-bg, var(--ac)); color: var(--cart-fg, var(--af)); font-weight: 600; font-size: 14px; transition: transform .3s; }
.b-cart:hover { transform: translateY(-1px); }
.b-cart b { min-width: 28px; height: 28px; padding: 0 8px; border-radius: var(--rb); background: var(--cart-n, rgba(255,255,255,.22)); display: inline-grid; place-items: center; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 13px; }
.burger { display: none; width: 44px; height: 44px; border-radius: var(--rb); border: 1px solid currentColor; background: none; cursor: pointer; place-items: center; font-size: 18px; }

/* menus */
.pn { position: absolute; top: calc(100% + 8px); z-index: 60; background: var(--mm-bg, #fff); color: var(--mm-fg, #111); border: 1px solid var(--mm-ln, rgba(0,0,0,.1)); border-radius: var(--mm-r, var(--r)); box-shadow: 0 40px 80px -30px rgba(8,16,40,.35), 0 2px 6px rgba(8,16,40,.06); visibility: hidden; opacity: 0; transform: translateY(-8px) scale(.985); transform-origin: top center; transition: opacity .22s, transform .35s cubic-bezier(.2,.8,.2,1), visibility 0s .35s; text-align: left; }
.pn::before { content: ""; position: absolute; left: 0; right: 0; top: -14px; height: 14px; }
.nv-i.open > .pn { visibility: visible; opacity: 1; transform: none; transition-delay: 0s; }
.dd { left: 0; min-width: 280px; padding: 8px; }
.dd a { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 11px 12px; border-radius: calc(var(--mm-r, var(--r)) * .55); font-size: 14px; font-weight: 500; line-height: 1.3; transition: background .2s, padding .3s; }
.dd a .i { opacity: 0; transform: translateX(-6px); transition: opacity .25s, transform .3s; font-size: 14px; color: var(--mm-ac, var(--ac)); }
.dd a:hover, .dd a:focus-visible { background: var(--mm-hv, rgba(0,0,0,.05)); }
.dd a:hover .i, .dd a:focus-visible .i { opacity: 1; transform: none; }

.mm { left: var(--gl); right: var(--gr); padding: 26px; display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); gap: 28px; }
.mm-h { font: 600 11px var(--fm); letter-spacing: .1em; text-transform: uppercase; color: var(--mm-mu, #666); margin-bottom: 12px; }
.mm-list { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 20px; }
.mm-c { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; padding: 9px 10px; border-radius: calc(var(--mm-r, var(--r)) * .5); font-size: 14px; font-weight: 500; line-height: 1.3; transition: background .2s, color .2s; }
.mm-c:hover, .mm-c:focus-visible { background: var(--mm-hv, rgba(0,0,0,.05)); }
.mm-c .ti { display: none; }
.mm-n { order: 0; min-width: 0; }
.mm-k { order: 1; font: 500 12px var(--fm); color: var(--mm-mu, #666); font-variant-numeric: tabular-nums; }
.mm-bar { display: none; order: 2; }
.mm-side { border-left: 1px solid var(--mm-ln, rgba(0,0,0,.1)); padding-left: 26px; display: flex; flex-direction: column; gap: 8px; }
.mm-side .mm-h:not(:first-child) { margin-top: 12px; }
.mm-box { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 14px; border: 1px solid var(--mm-ln, rgba(0,0,0,.1)); border-radius: calc(var(--mm-r, var(--r)) * .55); font-weight: 500; font-size: 14px; line-height: 1.3; transition: background .25s, border-color .25s, color .25s; }
.mm-box .i { transition: transform .3s; }
.mm-box:hover { background: var(--mm-ac, var(--ac)); border-color: var(--mm-ac, var(--ac)); color: var(--mm-af, var(--af)); }
.mm-box:hover .i { transform: translateX(3px); }
.mm-foot { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; border-top: 1px solid var(--mm-ln, rgba(0,0,0,.1)); padding-top: 16px; }
.mm-foot a { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.mm-foot a .i { transition: transform .3s; }
.mm-foot a:hover .i { transform: translateX(4px); }
.mm-pv { display: none; }

/* mega: proportional bars */
.mm-bars .mm-bar { display: block; grid-column: 1 / -1; height: 3px; border-radius: 3px; background: var(--mm-track, rgba(0,0,0,.07)); position: relative; overflow: hidden; }
.mm-bars .mm-bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: calc(var(--n) / 19 * 100%); background: var(--mm-ac, var(--ac)); border-radius: inherit; transform: scaleX(0); transform-origin: left; transition: transform .7s cubic-bezier(.2,.8,.2,1); transition-delay: calc(var(--i) * 30ms); }
.nv-i.open .mm-bars .mm-bar::after { transform: scaleX(1); }
/* mega: icon tiles */
.mm-tiles .mm-list { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.mm-tiles .mm-c { grid-template-columns: auto minmax(0, 1fr); padding: 10px; }
.mm-tiles .mm-c .ti { display: grid; place-items: center; grid-row: span 2; width: 40px; height: 40px; border-radius: calc(var(--mm-r, var(--r)) * .45); background: var(--mm-tile, rgba(0,0,0,.05)); color: var(--mm-ac, var(--ac)); font-size: 19px; transition: transform .35s cubic-bezier(.2,.8,.2,1), background .25s, color .25s; }
.mm-tiles .mm-c:hover .ti { transform: rotate(-8deg) scale(1.06); background: var(--mm-ac, var(--ac)); color: var(--mm-af, #fff); }
.mm-tiles .mm-k { order: 1; font-size: 11.5px; }
/* mega: ledger with dotted leaders */
.mm-ledger .mm-c { grid-template-columns: auto minmax(12px, 1fr) auto; }
.mm-ledger .mm-bar { display: block; order: 1; align-self: end; margin-bottom: 5px; border-bottom: 1.5px dotted var(--mm-mu, #888); opacity: .5; }
.mm-ledger .mm-k { order: 2; }
/* mega: list with a live preview pane */
.mm-preview { grid-template-columns: minmax(0, 1.5fr) minmax(0, .9fr) minmax(0, 1fr); }
.mm-preview .mm-pv { display: flex; flex-direction: column; justify-content: space-between; gap: 18px; border-radius: calc(var(--mm-r, var(--r)) * .7); background: var(--mm-pvbg, #111); color: var(--mm-pvfg, #fff); padding: 22px; min-height: 280px; position: relative; overflow: hidden; }
.mm-pv .pv-k { font: var(--wd) clamp(64px, 7vw, 108px)/.86 var(--fd); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.mm-pv .pv-n { font: 500 18px/1.2 var(--fd); letter-spacing: -.02em; }
.mm-pv .pv-u { font: 500 12px var(--fm); letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.mm-pv .pv-ic { position: absolute; right: 18px; top: 18px; font-size: 26px; opacity: .8; }
.mm-pv.flip .pv-k, .mm-pv.flip .pv-n { animation: pvIn .45s cubic-bezier(.2,.8,.2,1); }
@keyframes pvIn { from { opacity: 0; transform: translateY(10px); } }
.mm-preview .mm-list { grid-template-columns: 1fr 1fr; }
.mm-preview .mm-c[aria-current="true"] { background: var(--mm-hv, rgba(0,0,0,.05)); }
/* mega: count bubbles */
.mm-bubbles .mm-list { display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; }
.mm-bubbles .mm-c { display: inline-flex; gap: 10px; border: 1px solid var(--mm-ln, rgba(0,0,0,.12)); border-radius: 999px; padding: 6px 6px 6px 16px; }
.mm-bubbles .mm-k { order: 1; min-width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--mm-tile, #eee); color: var(--mm-fg); font-weight: 600; transition: transform .35s cubic-bezier(.3,1.6,.5,1); }
.mm-bubbles .mm-c:hover { background: var(--mm-ac); color: var(--mm-af); border-color: var(--mm-ac); }
.mm-bubbles .mm-c:hover .mm-k { transform: scale(1.18); }
/* mega: large type list */
.mm-type .mm-list { gap: 0 28px; }
.mm-type .mm-c { padding: 8px 4px; border-radius: 0; border-bottom: 1px solid var(--mm-ln); font: 300 19px/1.2 var(--fd); letter-spacing: -.02em; }
.mm-type .mm-k { font: italic 300 15px var(--fd); color: var(--mm-ac); align-self: start; }
.mm-type .mm-c:hover { background: none; padding-left: 12px; }
.mm-type .mm-c { transition: padding .35s cubic-bezier(.2,.8,.2,1); }

/* mobile drawer */
.drawer { position: fixed; inset: 0; z-index: 300; background: var(--dr-bg, var(--bg)); color: var(--dr-fg, var(--ink)); overflow: auto; padding: calc(14px + env(safe-area-inset-top, 0px)) var(--gr) calc(40px + env(safe-area-inset-bottom, 0px)) var(--gl); clip-path: circle(0 at calc(100% - 42px) 42px); visibility: hidden; transition: clip-path .6s cubic-bezier(.7,0,.2,1), visibility 0s .6s; }
.drawer.open { clip-path: circle(150% at calc(100% - 42px) 42px); visibility: visible; transition-delay: 0s; }
.dr-h { display: flex; justify-content: space-between; align-items: center; height: 60px; }
.drawer details { border-bottom: 1px solid var(--ln); }
.drawer summary { list-style: none; cursor: pointer; padding: 18px 2px; font: var(--wd) 24px/1.1 var(--fd); letter-spacing: -.02em; display: flex; justify-content: space-between; align-items: center; }
.drawer summary::-webkit-details-marker { display: none; }
.drawer summary .i { font-size: 16px; transition: transform .3s; }
.drawer details[open] summary .i { transform: rotate(180deg); }
.drawer details a { display: flex; justify-content: space-between; padding: 10px 2px 10px 12px; font-size: 15px; }
.drawer details a span { color: var(--mu); font-family: var(--fm); font-size: 12px; }
.drawer .mm-h { padding-left: 12px; margin: 12px 0 4px; color: var(--mu); }
.dr-login { display: block; margin-top: 24px; text-align: center; padding: 15px; border-radius: var(--rb); border: 1px solid currentColor; font-weight: 600; }

/* hero search */
.sub { margin-top: 22px; font-size: clamp(16px, 1.25vw, 18px); line-height: 1.55; max-width: 46ch; color: var(--sub-c, var(--mu)); }
.hs { margin-top: 32px; width: min(580px, 100%); }
.hs-f { display: flex; align-items: center; gap: 10px; background: var(--hs-bg, #fff); color: var(--hs-fg, var(--ink)); border: 1px solid var(--hs-ln, var(--ln)); border-radius: var(--hs-r, var(--rb)); padding: 7px 7px 7px 20px; box-shadow: var(--hs-sh, 0 24px 50px -28px rgba(0,0,0,.35)); transition: box-shadow .3s, transform .3s, border-color .3s; }
.hs-f:focus-within { border-color: var(--hs-ring, var(--ac)); transform: translateY(-1px); }
.hs-f > .i { font-size: 19px; opacity: .65; }
.hs-f input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; font-size: 15px; color: inherit; padding: 11px 0; outline: none; }
.hs-f input::placeholder { color: inherit; opacity: .55; }
.hs-f input::-webkit-search-cancel-button { display: none; }
.hs-b { min-height: 44px; background: var(--hs-btn, var(--ac)); color: var(--hs-btnf, var(--af)); border-radius: calc(var(--hs-r, var(--rb)) - 3px); }
.hs-pop { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; font-size: 13px; }
.hs-pop span { opacity: .72; margin-right: 4px; }
.hs-pop a { padding: 6px 13px; border: 1px solid var(--pop-ln, rgba(127,127,127,.45)); border-radius: var(--rb); transition: background .25s, color .25s, border-color .25s; }
.hs-pop a:hover { background: var(--pop-hv, var(--ink)); color: var(--pop-hvf, var(--bg)); border-color: var(--pop-hv, var(--ink)); }

/* photos */
.ph { position: relative; overflow: hidden; background: var(--ph-bg, var(--at)); }
.ph img { width: 100%; height: 100%; object-fit: cover; }
.ph.top img { object-position: 50% 20%; }

/* split-word headline */
.w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .1em; margin-bottom: -.1em; }
.wi { display: inline-block; animation: wUp 1.1s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--k) * 70ms + 120ms); }
@keyframes wUp { from { transform: translateY(110%); } }
.fade-up { animation: fUp 1s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--dl, .3s); }
@keyframes fUp { from { opacity: 0; transform: translateY(18px); } }

/* rotating badge */
.badge { position: absolute; width: 128px; height: 128px; z-index: 4; }
.badge svg { width: 100%; height: 100%; animation: spin 28s linear infinite; }
.badge circle { fill: var(--bd-bg, var(--ac)); }
.badge text { fill: var(--bd-fg, var(--af)); font: 600 9.2px var(--fm); letter-spacing: .08em; }
.badge .core { position: absolute; inset: 30px; border-radius: 50%; background: var(--bd-core, var(--hl, #fff)); color: var(--bd-corefg, var(--ink)); display: grid; place-items: center; font: 700 14px var(--fd); letter-spacing: -.02em; }
@keyframes spin { to { transform: rotate(360deg); } }

/* sections */
.sx { padding-block: var(--sp, 76px); position: relative; }
.sh { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px 48px; flex-wrap: wrap; margin-bottom: var(--shm, 52px); }
.sh > div { max-width: 680px; min-width: 0; }
.sh p { margin-top: 16px; color: var(--mu); font-size: 16px; max-width: 54ch; }
.more-l { display: inline-flex; align-items: center; gap: 12px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.more-l .ic { width: 42px; height: 42px; border-radius: var(--rb); border: 1px solid var(--ln); display: grid; place-items: center; font-size: 16px; transition: background .3s, color .3s, border-color .3s, transform .4s cubic-bezier(.2,.8,.2,1); }
.more-l:hover .ic { background: var(--ac); color: var(--af); border-color: var(--ac); transform: rotate(-45deg); }
.ar-d .more-l:hover .ic { transform: rotate(45deg); }

/* reveal on scroll (only for blocks below the first screen) */
.rv { opacity: 0; transform: translateY(26px); transition: opacity .8s cubic-bezier(.2,.8,.2,1), transform .9s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0ms); }
.rv.in { opacity: 1; transform: none; }

/* design switcher */
.switch { position: fixed; z-index: 9999; left: 50%; transform: translateX(-50%); bottom: max(14px, calc(env(safe-area-inset-bottom, 0px) + 10px)); display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: 999px; background: rgba(14,16,22,.92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); color: #fff; box-shadow: 0 16px 40px rgba(0,0,0,.32), inset 0 0 0 1px rgba(255,255,255,.08); font: 500 12px/1 system-ui, -apple-system, 'Segoe UI', sans-serif; max-width: calc(100% - 24px); overflow-x: auto; scrollbar-width: none; }
.switch::-webkit-scrollbar { display: none; }
.switch .sw-l { padding: 0 10px 0 14px; color: #A8AEBD; white-space: nowrap; }
.switch a { flex: none; min-width: 32px; height: 32px; padding: 0 8px; border-radius: 999px; display: inline-grid; place-items: center; font-weight: 600; color: #fff; transition: background .2s; }
.switch a:hover { background: rgba(255,255,255,.14); }
.switch a[aria-current="true"] { background: #fff; color: #0E1016; }
.switch .sw-n { padding: 0 14px 0 10px; white-space: nowrap; min-width: 92px; }
@media (max-width: 720px) { .switch .sw-l, .switch .sw-n { display: none; } }

@media (max-width: 1060px) {
  .nv, .b-login { display: none; }
  .burger { display: inline-grid; }
  .bar-end { margin-left: auto; }
}
@media (max-width: 720px) {
  .sx { padding-block: var(--sp-m, 48px); }
  .sh { margin-bottom: 34px; }
  .b-cart { padding-left: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
